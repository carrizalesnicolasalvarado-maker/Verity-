name: Crear APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el zip correcto
        run: |
          for z in *.zip; do
            rm -rf tmp
            mkdir tmp
            unzip -q "$z" -d tmp
            if ! grep -q "<circle" tmp/VerityExtractor/app/src/main/res/drawable/launcher_foreground.xml; then
              mv tmp/VerityExtractor .
              break
            fi
          done
          ls VerityExtractor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: VerityExtractor
      - uses: actions/upload-artifact@v4
        with:
          name: VerityExtractor-APK
          path: VerityExtractor/app/build/outputs/apk/debug/app-debug.apk
          
